# Workflow mẫu (copy vào BE repo: .github/workflows/push-api-docs.yml)
#
# Đóng vòng BE → docs repo: export OpenAPI → cắt theo feature → mở PR vào REPO DOCS của dự án.
# Tool dùng qua npx (@bdkha/document-kit); content = repo docs riêng (checkout bằng token).
#
# Cần secrets:
#   DOCS_REPO        = org/<project>-docs   (repo docs của dự án này)
#   DOCS_PUSH_TOKEN  = PAT/deploy token có quyền ghi repo docs (mở PR)
#   LINEAR_API_KEY   = (tuỳ chọn) để comment Linear báo FE
#
# Mapping feature: ưu tiên để AI/người chạy push-api với --tags/--paths.
# Nhiều feature → lặp lại bước push-api với selector tương ứng.

name: Push API docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & export OpenAPI
        run: |
          npm ci
          npx ts-node scripts/export-openapi.ts openapi.json

      - name: Checkout repo docs (content)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DOCS_REPO }}
          token: ${{ secrets.DOCS_PUSH_TOKEN }}
          path: docs-content

      - name: Push API into feature(s)
        env:
          DOC_KIT_ROOT: ${{ github.workspace }}/docs-content
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # ── Sửa danh sách feature ↔ selector cho khớp dự án ──
          npx -y -p @bdkha/document-kit doc-kit push-api F-001-user-onboarding openapi.json \
            --tags onboarding --ci --note "CI: ${{ github.sha }}"
          # npx -y -p @bdkha/document-kit doc-kit push-api F-002-wallet openapi.json --paths "/wallet/**" --ci

          # Notify FE qua Linear (bỏ qua nếu không có key)
          npx -y -p @bdkha/document-kit doc-kit notify F-001-user-onboarding \
            --note "CI: ${{ github.sha }}" --ci || true

      - name: Open PR to repo docs
        working-directory: docs-content
        env:
          GH_TOKEN: ${{ secrets.DOCS_PUSH_TOKEN }}
        run: |
          BRANCH="api-sync/${{ github.run_id }}"
          git config user.name "doc-kit-bot"
          git config user.email "doc-kit-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi API, bỏ qua."
            exit 0
          fi
          git commit -m "chore(api): sync OpenAPI từ BE ${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --fill --base main --head "$BRANCH" \
            --title "API sync từ BE (${{ github.sha }})" \
            --body "Tự động từ CI BE. Kiểm tra api-spec.md + CHANGELOG trước khi merge."
